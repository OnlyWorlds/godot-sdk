# The headless suite, the generators' drift checks, the written promise's check and the release zip's install on a
# Linux runner, on every push and pull request.
# Godot needs no licence and the tests no key or network (the client's tests use a fake transport), so this
# workflow holds no secret. Tests that need a world outside this repository (OW_SIKELIA, OW_MOPPETOPIA) skip here.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The codegen's text normalisation is pinned to Unicode 15.1.0, which every Python 3.13 carries; the runner's own
      # python3 is newer (Unicode 16.0.0) and the drift check refuses it.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Drift checks (Python standard library)
        run: |
          python3 codegen/generate.py --check
          python3 codegen/generate_tools.py --check
          python3 codegen/generate_layout.py --check
          python3 codegen/generate_layout_3d.py --check
          python3 codegen/generate_frame_bits.py --check
          python3 codegen/test_generate_views.py

      - name: Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot
          rm godot.zip

      - name: Import, then the suite
        run: |
          ./godot --headless --path . --import
          ./godot --headless --path . --script res://tests/run.gd

      # The written promise (the docs' Stability page): no public name gone within a major, every public name listed
      # in tools/public-names.json, every @deprecated saying since which release and the release it leaves in. Godot's
      # own doctool reads the names. A change that adds public names runs `--write` and commits the file. The second
      # line watches the first fail once for each rule.
      - name: The written promise
        run: |
          python3 tools/verify_promise.py --godot ./godot
          python3 tools/mutants_promise.py --godot ./godot

      # The zip a release carries, made from this commit and unpacked into an empty project, which reads a world on
      # disk through it: a file the addon needs and the zip leaves out fails here.
      - name: The release zip, installed in an empty project
        run: |
          python3 tools/release_zip.py HEAD --out dist
          python3 tools/prove_zip.py dist/onlyworlds-godot-*.zip --godot ./godot
